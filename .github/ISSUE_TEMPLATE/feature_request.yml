name: Feature request
description: Propose a scoped product or platform improvement.
title: "feature: "
labels:
  - "type: feature"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operator problem, not only a solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: risk
    attributes:
      label: Security, privacy, and compatibility impact
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
        - label: This request contains no secrets, private data, or vulnerability details.
          required: true
