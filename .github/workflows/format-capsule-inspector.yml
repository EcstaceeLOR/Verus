name: Format Hackathon Capsule Inspector

on:
  push:
    branches:
      - hackathon-150-capsule-inspector-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hackathon-150-capsule-inspector-v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Format capsule inspector files
        run: |
          corepack pnpm exec prettier --write             api/context-capsule.ts             apps/console/src/AgentPlayground.tsx             apps/console/src/CapsuleInspector.tsx             apps/console/src/capsule-inspector.ts             apps/console/src/capsule-inspector.css             apps/console/src/capsule-inspector.test.ts             test/hosted-scan.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             api/context-capsule.ts             apps/console/src/AgentPlayground.tsx             apps/console/src/CapsuleInspector.tsx             apps/console/src/capsule-inspector.ts             apps/console/src/capsule-inspector.css             apps/console/src/capsule-inspector.test.ts             test/hosted-scan.test.ts
          git commit -m "style: format capsule inspector"
          git push origin HEAD:hackathon-150-capsule-inspector-v2
