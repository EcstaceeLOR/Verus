name: Persistence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: persistence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.0-alpine3.22
        env:
          POSTGRES_DB: verus_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d verus_test" --health-interval 5s --health-timeout
          3s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/verus_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @verus/crypto... build
      - run: corepack pnpm --filter @verus/crypto test
      - run: corepack pnpm --filter @verus/persistence... build
      - run: corepack pnpm --filter @verus/persistence test:integration
      - run: corepack pnpm --filter @verus/persistence migrate
      - run: corepack pnpm --filter @verus/contracts build
      - run: corepack pnpm --filter @verus/domain build
      - run: corepack pnpm --filter @verus/persistence build
      - run: corepack pnpm --filter @verus/detection build
      - run: corepack pnpm --filter @verus/capsules build
      - run: corepack pnpm --filter @verus/ingestion build
      - run: corepack pnpm --filter @verus/ingestion test
      - run: corepack pnpm --filter @verus/jobs... build
      - run: corepack pnpm --filter @verus/jobs test:integration
