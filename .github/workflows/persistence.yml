name: Persistence

on:
  pull_request:
    paths:
      - ".github/workflows/persistence.yml"
      - "packages/persistence/**"
      - "packages/contracts/**"
      - "packages/domain/**"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/persistence.yml"
      - "packages/persistence/**"
      - "packages/contracts/**"
      - "packages/domain/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: persistence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.0-alpine3.22
        env:
          POSTGRES_DB: verus_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d verus_test" --health-interval 5s --health-timeout
          3s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/verus_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @verus/persistence... build
      - run: corepack pnpm --filter @verus/persistence test:integration
